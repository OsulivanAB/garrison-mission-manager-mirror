name: Sync upstream into upstream branch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream -> upstream (force) incl tags
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "rowaasr13/garrison-mission-manager"
          source_branch: "master"
          destination_branch: "upstream"
          github_token: ${{ secrets.PAT }}
          sync_tags: "true"
