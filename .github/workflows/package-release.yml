name: Package addon + publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"   # only run when a tag is pushed (mirrored from upstream)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build WowUp-compatible zip
        run: |
          set -euo pipefail
          addon="GarrisonMissionManager"

          rm -rf dist
          mkdir -p "dist/${addon}"

          rsync -av \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "dist" \
            ./ "dist/${addon}/"

          cd dist
          zip -r "../${addon}.zip" "${addon}"

      - name: Create or update GitHub Release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GarrisonMissionManager.zip
